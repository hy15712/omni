<h1>쓰레기통 좌표 찾기 (조사팀용)</h1>
<p class="sub">종로구·중구 쓰레기통 공공데이터의 주소를 <b>브이월드 지오코더</b>로 좌표로 바꿉니다. 결과는 이 화면에만 나오고 어디에도 저장되지 않습니다.</p>
<div class="box">
<b>사용법</b><br>1) ‘좌표 찾기 시작’을 누르고 1~2분 기다립니다.<br>2) 끝나면 ‘결과 복사’를 눌러 Claude 대화창에 붙여 넣습니다(범위 근처 것만 복사됨).<br>
노란 줄 = 우리 조사 범위 안. 주소가 없는 정류장(중구)은 ‘주소 없음’으로 나오며, 조사 모드에서 직접 찍어야 합니다.
</div>

const KEY = (window.MAP_CONFIG||{}).VWORLD_KEY, B = window.SURVEY_BOUNDS;

const res = {};
function draw() {
  $("tb").innerHTML = ROWS.map(r => { const x = res[r.n] || {}; const inb = x.inBounds;

      : x.status ? `<td class="st-fail">${esc(x.status)}</td>` : "<td></td>";
    return `<tr class="${inb ? "in" : ""}"><td>${r.n}</td><td>${r.gu}</td><td>${esc(r.addr || "—")}</td><td>${esc(r.desc)}</td><td>${r.count}</td>${st}</tr>`; }).join("");
}
let seq = 0;
function geocode(address, type) {
  return new Promise(resolve => {
    const cb = "vwcb" + (++seq), s = document.createElement("script");
    const t = setTimeout(() => { done(null, "시간 초과"); }, 10000);
    function done(v, err) { clearTimeout(t); delete window[cb]; s.remove(); resolve(v ? v : { err }); }
    window[cb] = j => { const r = j && j.response; if (r && r.status === "OK") done({ lat: +r.result.point.y, lng: +r.result.point.x, refined: r.refined && r.refined.text });
      else done(null, r ? (r.status === "NOT_FOUND" ? "못 찾음" : (r.error && r.error.text) || r.status) : "응답 없음"); };

    document.body.appendChild(s);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

    failed: ROWS.filter(r => res[r.n] && res[r.n].status !== "ok" && res[r.n].status !== "주소 없음").map(r => r.n) });
  $("copy").disabled = false;
};
$("copy").onclick = async () => {
